name: Refresh dependency README

on:
  push:
    branches:
      - feature/45-timing-2.2.3-dependency-refresh

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/45-timing-2.2.3-dependency-refresh
      - name: Refresh current-version documentation
        shell: python
        run: |
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text()
          replacements = [
              ('This source tree is version **3.1.2**.', 'This source tree is version **3.1.3**.'),
              ('ESPressio Threads `3.1.2` targets the **ESP32 family under Arduino-ESP32**.', 'ESPressio Threads `3.1.3` targets the **ESP32 family under Arduino-ESP32**.'),
              ('the `3.1.2` PlatformIO package', 'the `3.1.3` PlatformIO package'),
              ('flowduino/ESPressio-Threads@^3.1.2', 'flowduino/ESPressio-Threads@^3.1.3'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'missing expected README text: {old}')
              text = text.replace(old, new, 1)
          marker = 'Refer to the GitHub Releases page for the latest published release/tag.\n'
          addition = marker + '\nCurrent required ESPressio baselines:\n\n```text\nTiming >= 2.2.3 < 3.0.0\nObservable >= 3.0.1 < 4.0.0\n```\n\nTiming 2.2.3 carries Units 0.2.2 downstream; Serializable remains optional through Serializable Unit representations rather than becoming a direct Threads dependency.\n'
          if addition not in text:
              if marker not in text:
                  raise SystemExit('missing release marker')
              text = text.replace(marker, addition, 1)
          path.write_text(text)
      - name: Commit README
        run: |
          if git diff --quiet -- README.md; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md
          git commit -m 'docs: refresh Threads 3.1.3 README (#45)'
          git push origin HEAD:feature/45-timing-2.2.3-dependency-refresh
